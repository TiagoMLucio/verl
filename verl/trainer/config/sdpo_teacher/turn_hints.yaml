# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Per-turn reflector hints: the teacher scores each hinted turn on [context<t + hint], one
# spliced sub-row per hint. Select with
# sdpo_teacher@actor_rollout_ref.actor.self_distillation.teacher=turn_hints.

# The teacher class (project code, outside verl); the other keys are its keyword options
_target_: uni_agent.sdpo.TurnHintTeacher

# Template for one injected hint; spliced immediately before the hinted turn's tokens.
# The splice is a real user turn, so the teacher's instinct is to answer it: 9.9% of scored
# turns opened with "Thank you for the guidance" against 0 of 514 the student ever wrote.
# Those tokens exist only because the note appeared, and the student has no mass on them.
# "Act on this directly in your next tool call" asked for the reasoning collapse it produced:
# bare-call turns went 2.3% -> 91% over five steps, and the teacher's own continuations open
# straight with a tool call. Deliberation is restored here; the no-acknowledgement half stays.
turn_hint_template: "[Guidance for your next action: {hint}\nWork out in your own words what this implies for the current state before you act, then take the action it points to. Do not acknowledge it, thank anyone for it, quote it, or refer to it: it is not part of the conversation, and the turn you write must read as if it were never sent.]\n"

# Wraps hints the rollout marks `at: call` (spliced between a turn's reasoning and its tool
# call). The next token after it must be the call itself, so unlike the turn template it must
# never invite deliberation; measured at the decisive token this framing conditions as hard as
# the turn wrapper (12.9 vs 12.5 nats) while bare and prefill framings roughly halve the shift.
call_hint_template: "[A note on the tool call you are about to write: {hint}\nContinue exactly where you left off: your next output is the tool call itself - no reply, no acknowledgement, no further reasoning, as if this note were never sent.]\n"

# Rollout-side apply_chat_template kwargs, mirrored when deriving header/hint fragments
# (e.g. {enable_thinking: false} for Qwen3.5); must match the agent config's value
chat_template_kwargs: {}

# Cap on hinted turns per sample (keeps the first ones; null = all)
max_hinted_turns: null

# lambda in `L = L_turn + lambda * L_call`: weight of call-hinted rows relative to
# turn-hinted (pipeline) ones. 1.0 = today, where call rows carry ~85-90% of the update
call_loss_weight: 1.0
